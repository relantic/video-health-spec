# Warehouse variant — warehouse picking, packing, and stocking.
# Applies on top of the egocentric profile.
#
# Use case: Robot picking demonstrations, order fulfillment training,
# pallet stacking. Industrial indoor, forklifts, high shelves,
# variable lighting (bright aisles, dark upper racks), consented workers.

name: warehouse
base_profile: egocentric

overrides:

  - code: quality-blurry
    name: Video is blurry
    pass: ">=12"          # industrial cameras, controlled environment
    flag: "6–12"
    reject: "<6"

  - code: quality-bad-exposure
    name: Exposure out of range
    pass: "0.12–0.85"     # bright aisle floors, dark upper rack levels, loading dock doors
    flag: "0.06–0.92"
    reject: "<0.06"

  - code: quality-duration-out-of-bounds
    name: Duration out of bounds
    pass: "120–3600"      # pick-pack sessions — up to 1hr shifts
    flag: "60–120"
    reject: "<60"

  - code: privacy-face-visible
    name: Identifiable face
    pass: "<0.2"          # relaxed — workers are consented, few visitors
    flag: "0.2–0.4"
    reject: ">=0.4"

  - code: privacy-speech-audio
    name: Speech in audio track
    pass: "<0.15"         # relaxed — consented workers, radio chatter expected
    flag: "0.15–0.3"
    reject: ">=0.3"

  - code: privacy-visible-text
    name: Visible text detected
    pass: "<0.3"          # shipping labels, bin numbers, SKU codes are expected
    flag: "0.3–0.5"
    reject: ">=0.5"
    note: >
      Bin labels, SKU codes, and location markers are expected training signal.
      Reject only when customer addresses on shipping labels are visible.

  - code: safety-sharp-object
    name: Unsafe sharp object
    pass: "<0.3"          # box cutters, pallet knives are standard
    flag: "0.3–0.5"
    reject: ">=0.5"
    note: Box cutters and tape guns are standard warehouse tools.

  - code: egoexo-sparse-narration
    name: Narration too sparse
    pass: ">=2.0"         # pick-pack steps are fast and sequential
    flag: "1.0–2.0"
    reject: "<1.0"
    note: "Narration should capture: scan bin, pick item, place in tote, confirm scan."
