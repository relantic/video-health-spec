# Aerial profile — drone and aerial video.
# UAV mapping, inspection, agriculture overflights, surveillance.
# Extreme distances, high speeds, unique privacy model (property, not faces).
#
# Privacy departures from base: bathroom, phone, screen, and reflective-surface
# rules are removed (irrelevant from altitude). Replaced with property-overflight
# and license-plate-visible rules specific to the aerial perspective.
#
# Codes carry their category as a prefix: quality-*, privacy-*, safety-*,
# metadata-*, flight-*. The validator emits the full path
# `video-health/aerial/{code}` when an issue fires.

rules:

  # ── Technical Quality ──

  - code: quality-missing-moov
    name: Missing 'moov' atom
    metric: moov_present
    type: bool
    pass: true
    reject: false

  - code: quality-corrupt-header
    name: Corrupt container header
    metric: header_valid
    type: bool
    pass: true
    reject: false

  - code: quality-truncated-file
    name: Truncated file
    metric: file_complete
    type: bool
    pass: true
    reject: false

  - code: quality-no-keyframes
    name: No keyframes
    metric: keyframes_present
    type: bool
    pass: true
    reject: false

  - code: quality-gop-too-long
    name: GOP too long
    metric: max_gop_sec
    type: float
    pass: "<=10"
    flag: ">10"

  - code: quality-duplicate-frames
    name: Duplicate frames detected
    metric: duplicate_frame_count
    type: int
    pass: 0
    flag: ">0"

  - code: quality-timing-gaps
    name: Timing gaps in sample table
    metric: timing_gaps_present
    type: bool
    pass: false
    flag: true

  - code: quality-low-bitrate
    name: Bitrate too low
    metric: bit_rate
    type: int
    pass: ">=500000"
    flag: "<500000"

  - code: quality-high-bitrate
    name: Bitrate too high
    metric: bit_rate
    type: int
    pass: "<=50000000"
    flag: ">50000000"

  - code: quality-file-too-small
    name: File below minimum size
    metric: size_bytes
    type: int
    pass: ">=1024"
    reject: "<1024"

  - code: quality-ffprobe-failed
    name: ffprobe failed to parse video
    metric: ffprobe_ok
    type: bool
    pass: true
    flag: false

  - code: quality-validator-error
    name: Validator encountered an error processing the file
    metric: validator_ok
    type: bool
    pass: true
    flag: false

  - code: quality-spec-mismatch
    name: Codec or resolution does not match spec
    metric: spec_match
    type: bool
    pass: true
    flag: false

  - code: quality-variable-frame-rate
    name: Variable frame rate
    metric: vfr_detected
    type: bool
    pass: false
    flag: true

  - code: quality-irregular-gop
    name: Irregular GOP structure
    metric: gop_cv
    type: float
    pass: "<0.3"
    flag: ">=0.3"

  - code: quality-container-codec-mismatch
    name: Container and codec do not match
    metric: container_codec_match
    type: bool
    pass: true
    flag: false

  - code: quality-metadata-rotation
    name: Display matrix rotation in container
    metric: rotation_present
    type: bool
    pass: false
    flag: true

  - code: quality-edit-list
    name: Edit list present
    metric: edit_list_present
    type: bool
    pass: false
    flag: true

  - code: quality-multiple-video-tracks
    name: Multiple video tracks
    metric: video_track_count
    type: int
    pass: "1"
    flag: ">1"

  - code: quality-blurry
    name: Video is blurry
    metric: blur_score
    type: float
    pass: ">=5"            # extreme distances reduce apparent sharpness; rotor vibration
    flag: "2–5"
    reject: "<2"

  - code: quality-bad-exposure
    name: Exposure out of range
    metric: brightness
    type: float
    pass: "0.1–0.9"        # sky/ground contrast, sun directly in frame, shadows
    flag: "0.05–0.95"
    reject: "<0.05"

  - code: quality-lens-blocked
    name: Lens obstruction
    metric: blockage_ratio
    type: ratio
    pass: "<0.05"
    flag: "<0.25"
    reject: ">=0.25"

  - code: quality-duration-out-of-bounds
    name: Duration out of bounds
    metric: duration_sec
    type: float
    pass: "60–1800"        # 1min survey passes to 30min inspection orbits
    flag: "30–60"
    reject: "<30"

  - code: quality-invalid-intrinsics
    name: Camera intrinsics invalid
    metric: intrinsics_valid
    type: bool
    pass: true
    reject: false
    note: Mapping and photogrammetry require precise intrinsics

  # ── Sensor Quality ──

  - code: quality-missing-imu
    name: IMU data missing
    metric: imu_present
    type: bool
    pass: true
    reject: false
    note: Flight stability estimation requires IMU; without it, video is unprocessable

  - code: quality-imu-desync
    name: IMU data out of sync with video
    metric: imu_sync_drift_ms
    type: float
    unit: milliseconds
    pass: "<5"             # tightest — high-speed flight means small drift causes large positional error
    flag: "5–30"
    reject: ">=30"

  # quality-missing-depth intentionally excluded — depth sensors do not work at aerial distances

  # ── Privacy ──
  #
  # Aerial privacy is fundamentally different from ground-level privacy.
  # Faces, phones, screens, and reflective surfaces are not resolvable at
  # altitude. Instead, the risks are property overflight (looking into yards,
  # over fences) and license plate capture at low altitude.

  - code: privacy-face-visible
    name: Identifiable face
    metric: face_ratio
    type: ratio
    pass: "<0.3"           # dramatically relaxed — faces rarely resolvable at altitude
    flag: "0.3–0.5"

  - code: privacy-person-closeup
    name: Close-range person detected
    metric: person_closeup_ratio
    type: ratio
    pass: "<0.5"           # people are small dots at altitude
    flag: "0.5–0.7"

  - code: privacy-document-visible
    name: Personal document visible
    metric: document_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.2"
    reject: ">=0.2"

  - code: privacy-visible-text
    name: Visible text detected
    metric: text_frames_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.3"
    reject: ">=0.3"

  - code: privacy-speech-audio
    name: Speech in audio track
    metric: speech_ratio
    type: ratio
    pass: "<0.05"
    reject: ">=0.05"

  - code: privacy-property-overflight
    name: Private property overflight
    metric: private_property_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.3"
    reject: ">=0.3"
    note: Overhead view into private yards, pools, patios. Aerial privacy is about property, not faces.

  - code: privacy-license-plate-visible
    name: License plate visible
    metric: license_plate_ratio
    type: ratio
    pass: "<0.02"
    flag: "0.02–0.05"
    reject: ">=0.05"
    note: At low altitude, drone cameras can resolve license plates in driveways and parking lots

  # ── Safety ──

  - code: safety-sharp-object
    name: Unsafe sharp object
    metric: sharp_object_ratio
    type: ratio
    pass: "<0.05"
    flag: "0.05–0.1"
    reject: ">=0.1"

  # ── Training Value ──

  - code: training-black-frames
    name: Excessive black frames
    metric: black_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.3"
    reject: ">=0.3"

  - code: training-frozen-video
    name: Frozen / stuck video
    metric: freeze_ratio
    type: ratio
    pass: "<0.2"
    flag: "0.2–0.5"
    reject: ">=0.5"

  # ── Metadata ──

  - code: metadata-mismatch
    name: Metadata mismatch
    metric: metadata_match
    type: bool
    pass: true
    flag: false

  # ── Flight ──

  - code: flight-altitude-missing
    name: Altitude data missing
    metric: altitude_present
    type: bool
    pass: true
    reject: false
    note: Barometric or GPS altitude required for scale estimation and no-fly zone compliance

  - code: flight-altitude-out-of-bounds
    name: Altitude out of bounds
    metric: altitude_m
    type: float
    unit: meters_agl
    pass: "5–120"
    flag: "1–5"
    reject: "<1"
    note: Sub-1m is ground-level. Above 120m exceeds most regulatory limits (FAA Part 107).

  - code: flight-gps-invalid
    name: GPS data invalid or missing
    metric: gps_valid
    type: bool
    pass: true
    reject: false
    note: Required for geotagging, no-fly zone validation, and mapping

  - code: flight-stability-poor
    name: Flight stability poor
    metric: stability_score
    type: float
    pass: ">=0.7"
    flag: "0.4–0.7"
    reject: "<0.4"
    note: Derived from IMU jitter and frame-to-frame homography stability. Wind gusts are the most common cause.

  - code: flight-gimbal-drift
    name: Gimbal drift detected
    metric: gimbal_drift_deg
    type: float
    unit: degrees
    pass: "<2"
    flag: "2–5"
    reject: ">=5"
    note: Gimbal should maintain stable horizon. Drift above 5 degrees indicates failure or severe turbulence.
