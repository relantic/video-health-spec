# Manipulation profile — robot demonstration quality.
# Egocentric checks + demonstration quality + trajectory/RLDS compliance.
#
# Codes carry their category as a prefix: quality-*, privacy-*, safety-*,
# training-*, metadata-*, egoexo-*, task-*, demo-*, trajectory-*.
# The validator emits the full path `video-health/manipulation/{code}`
# when an issue fires.

rules:

  # ── Technical Quality ──

  - code: quality-missing-moov
    name: Missing 'moov' atom
    metric: moov_present
    type: bool
    pass: true
    reject: false

  - code: quality-corrupt-header
    name: Corrupt container header
    metric: header_valid
    type: bool
    pass: true
    reject: false

  - code: quality-truncated-file
    name: Truncated file
    metric: file_complete
    type: bool
    pass: true
    reject: false

  - code: quality-no-keyframes
    name: No keyframes
    metric: keyframes_present
    type: bool
    pass: true
    reject: false

  - code: quality-gop-too-long
    name: GOP too long
    metric: max_gop_sec
    type: float
    pass: "<=10"
    flag: ">10"

  - code: quality-duplicate-frames
    name: Duplicate frames detected
    metric: duplicate_frame_count
    type: int
    pass: 0
    flag: ">0"

  - code: quality-timing-gaps
    name: Timing gaps in sample table
    metric: timing_gaps_present
    type: bool
    pass: false
    flag: true

  - code: quality-low-bitrate
    name: Bitrate too low
    metric: bit_rate
    type: int
    pass: ">=500000"
    flag: "<500000"

  - code: quality-high-bitrate
    name: Bitrate too high
    metric: bit_rate
    type: int
    pass: "<=50000000"
    flag: ">50000000"

  - code: quality-file-too-small
    name: File below minimum size
    metric: size_bytes
    type: int
    pass: ">=1024"
    reject: "<1024"

  - code: quality-ffprobe-failed
    name: ffprobe failed to parse video
    metric: ffprobe_ok
    type: bool
    pass: true
    flag: false

  - code: quality-validator-error
    name: Validator encountered an error processing the file
    metric: validator_ok
    type: bool
    pass: true
    flag: false

  - code: quality-spec-mismatch
    name: Codec or resolution does not match spec
    metric: spec_match
    type: bool
    pass: true
    flag: false

  - code: quality-variable-frame-rate
    name: Variable frame rate
    metric: vfr_detected
    type: bool
    pass: false
    flag: true

  - code: quality-irregular-gop
    name: Irregular GOP structure
    metric: gop_cv
    type: float
    pass: "<0.3"
    flag: ">=0.3"

  - code: quality-container-codec-mismatch
    name: Container and codec do not match
    metric: container_codec_match
    type: bool
    pass: true
    flag: false

  - code: quality-metadata-rotation
    name: Display matrix rotation in container
    metric: rotation_present
    type: bool
    pass: false
    flag: true

  - code: quality-edit-list
    name: Edit list present
    metric: edit_list_present
    type: bool
    pass: false
    flag: true

  - code: quality-multiple-video-tracks
    name: Multiple video tracks
    metric: video_track_count
    type: int
    pass: "1"
    flag: ">1"

  - code: quality-blurry
    name: Video is blurry
    metric: blur_score
    type: float
    pass: ">=10"
    flag: "3–10"
    reject: "<3"

  - code: quality-bad-exposure
    name: Exposure out of range
    metric: brightness
    type: float
    pass: "0.2–0.8"
    flag: "0.1–0.9"
    reject: "<0.1"

  - code: quality-lens-blocked
    name: Lens obstruction
    metric: blockage_ratio
    type: ratio
    pass: "<0.05"
    flag: "<0.25"
    reject: ">=0.25"

  - code: quality-duration-out-of-bounds
    name: Duration out of bounds
    metric: duration_sec
    type: float
    pass: "60–600"
    flag: "30–60"
    reject: "<30"

  - code: quality-invalid-intrinsics
    name: Camera intrinsics invalid
    metric: intrinsics_valid
    type: bool
    pass: true
    reject: false

  # ── Privacy ──

  - code: privacy-bathroom-visible
    name: Bathroom visible
    metric: bathroom_ratio
    type: ratio
    pass: "<0.05"
    reject: ">=0.1"

  - code: privacy-reflective-surface
    name: Reflective surface exposing identifiable content
    metric: reflective_ratio
    type: ratio
    pass: "<0.05"
    flag: "0.05–0.15"
    reject: ">=0.15"

  - code: privacy-phone-visible
    name: Phone visible
    metric: phone_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.3"
    reject: ">=0.3"

  - code: privacy-document-visible
    name: Personal document visible
    metric: document_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.2"
    reject: ">=0.2"

  - code: privacy-face-visible
    name: Identifiable face
    metric: face_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.25"
    reject: ">=0.25"

  - code: privacy-person-closeup
    name: Close-range person detected
    metric: person_closeup_ratio
    type: ratio
    pass: "<0.25"
    flag: "0.25–0.5"

  - code: privacy-visible-text
    name: Visible text detected
    metric: text_frames_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.3"
    reject: ">=0.3"

  - code: privacy-screen-visible
    name: Screen content visible
    metric: screen_ratio
    type: ratio
    pass: "<0.3"
    flag: "0.3–0.5"
    reject: ">=0.5"

  - code: privacy-speech-audio
    name: Speech in audio track
    metric: speech_ratio
    type: ratio
    pass: "<0.05"
    reject: ">=0.05"

  # ── Safety ──

  - code: safety-sharp-object
    name: Unsafe sharp object
    metric: sharp_object_ratio
    type: ratio
    pass: "<0.05"
    flag: "0.05–0.1"
    reject: ">=0.1"

  # ── Training Value ──

  - code: training-no-hands-visible
    name: No hands visible
    metric: person_ratio
    type: ratio
    pass: ">=0.5"
    flag: "0.1–0.5"
    reject: "<0.1"

  - code: training-static-video
    name: Static video
    metric: motion_score
    type: float
    pass: ">=6"
    flag: "3–6"
    reject: "<3"

  - code: training-black-frames
    name: Excessive black frames
    metric: black_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.3"
    reject: ">=0.3"

  - code: training-frozen-video
    name: Frozen / stuck video
    metric: freeze_ratio
    type: ratio
    pass: "<0.2"
    flag: "0.2–0.5"
    reject: ">=0.5"

  # ── Metadata ──

  - code: metadata-mismatch
    name: Metadata mismatch
    metric: metadata_match
    type: bool
    pass: true
    flag: false

  # ── Sensor Quality ──

  - code: quality-missing-imu
    name: IMU data missing
    metric: imu_present
    type: bool
    pass: true
    reject: false
    note: Required for action-state alignment in robot demonstrations

  - code: quality-imu-desync
    name: IMU data out of sync with video
    metric: imu_sync_drift_ms
    type: float
    unit: milliseconds
    pass: "<10"
    flag: "10–50"
    reject: ">=50"

  - code: quality-missing-depth
    name: Depth channel missing
    metric: depth_present
    type: bool
    pass: true
    reject: false
    note: Required for grasp planning and 3D reconstruction

  # ── Ego-Exo ──

  - code: egoexo-egomotion-missing
    name: Egomotion data missing
    metric: egomotion_valid
    type: bool
    pass: true
    reject: false

  - code: egoexo-sparse-narration
    name: Narration too sparse
    metric: narration_density
    type: float
    unit: annotations_per_min
    pass: ">=2.0"
    flag: "0.5–2.0"
    reject: "<0.5"

  # ── Task Granularity ──

  - code: task-maneuverability-untagged
    name: Maneuverability class not tagged
    metric: maneuverability_tagged
    type: bool
    pass: true
    flag: false
    note: "Coarse vs fine. Fine-maneuverability tasks (sub-mm precision) enforce stricter blur and focus thresholds."

  # ── Demonstration Quality ──

  - code: demo-incomplete-task
    name: Task not completed
    metric: task_completed
    type: bool
    pass: true
    flag: false

  - code: demo-jerky-motion
    name: Jerky motion
    metric: jerk_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.2"
    reject: ">=0.2"

  - code: demo-low-manipulation
    name: Low manipulation ratio
    metric: manipulation_ratio
    type: ratio
    pass: ">=0.5"
    flag: "0.3–0.5"
    reject: "<0.3"

  - code: demo-excessive-idle
    name: Excessive idle time
    metric: idle_ratio
    type: ratio
    pass: "<0.2"
    flag: "0.2–0.4"
    reject: ">=0.4"

  - code: demo-no-interaction
    name: No hand-object interaction
    metric: interaction_ratio
    type: ratio
    pass: ">=0.5"
    flag: "0.2–0.5"
    reject: "<0.2"

  - code: demo-bad-viewpoint
    name: Bad viewpoint for task
    metric: off_axis_ratio
    type: ratio
    pass: "<0.05"
    flag: "0.05–0.1"
    reject: ">=0.1"

  # ── Trajectory (RLDS / Open X-Embodiment) ──

  - code: trajectory-invalid-episode
    name: Invalid episode structure
    metric: rlds_valid
    type: bool
    pass: true
    reject: false
    note: Each episode must contain steps with [observation, state, action, reward, language_instruction]

  - code: trajectory-invalid-action-vector
    name: Invalid action vector
    metric: action_dim_valid
    type: bool
    pass: true
    reject: false
    note: Canonical 7-DOF format (x, y, z, roll, pitch, yaw, gripper_state) per OXE standard

  - code: trajectory-missing-reward
    name: Missing reward tag
    metric: reward_annotated
    type: bool
    pass: true
    flag: false
    note: Binary sparse reward (1.0 = success, 0.0 = failure) on final frame of each episode
