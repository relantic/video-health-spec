# Egocentric profile — head-mounted cameras, hand manipulation tasks.
# Base quality/privacy/safety checks + hand visibility + motion + egomotion
# + dense narration + task granularity.
#
# Codes carry their category as a prefix: quality-*, privacy-*, safety-*,
# training-*, metadata-*, egoexo-*, task-*. The validator emits the full
# path `video-health/egocentric/{code}` when an issue fires.

rules:

  # ── Technical Quality ──

  - code: quality-missing-moov
    name: Missing 'moov' atom
    metric: moov_present
    type: bool
    pass: true
    reject: false

  - code: quality-corrupt-header
    name: Corrupt container header
    metric: header_valid
    type: bool
    pass: true
    reject: false

  - code: quality-truncated-file
    name: Truncated file
    metric: file_complete
    type: bool
    pass: true
    reject: false

  - code: quality-no-keyframes
    name: No keyframes
    metric: keyframes_present
    type: bool
    pass: true
    reject: false

  - code: quality-gop-too-long
    name: GOP too long
    metric: max_gop_sec
    type: float
    pass: "<=10"
    flag: ">10"

  - code: quality-duplicate-frames
    name: Duplicate frames detected
    metric: duplicate_frame_count
    type: int
    pass: 0
    flag: ">0"

  - code: quality-timing-gaps
    name: Timing gaps in sample table
    metric: timing_gaps_present
    type: bool
    pass: false
    flag: true

  - code: quality-low-bitrate
    name: Bitrate too low
    metric: bit_rate
    type: int
    pass: ">=500000"
    flag: "<500000"

  - code: quality-high-bitrate
    name: Bitrate too high
    metric: bit_rate
    type: int
    pass: "<=50000000"
    flag: ">50000000"

  - code: quality-file-too-small
    name: File below minimum size
    metric: size_bytes
    type: int
    pass: ">=1024"
    reject: "<1024"

  - code: quality-ffprobe-failed
    name: ffprobe failed to parse video
    metric: ffprobe_ok
    type: bool
    pass: true
    flag: false

  - code: quality-validator-error
    name: Validator encountered an error processing the file
    metric: validator_ok
    type: bool
    pass: true
    flag: false

  - code: quality-spec-mismatch
    name: Codec or resolution does not match spec
    metric: spec_match
    type: bool
    pass: true
    flag: false

  - code: quality-variable-frame-rate
    name: Variable frame rate
    metric: vfr_detected
    type: bool
    pass: false
    flag: true

  - code: quality-irregular-gop
    name: Irregular GOP structure
    metric: gop_cv
    type: float
    pass: "<0.3"
    flag: ">=0.3"

  - code: quality-container-codec-mismatch
    name: Container and codec do not match
    metric: container_codec_match
    type: bool
    pass: true
    flag: false

  - code: quality-metadata-rotation
    name: Display matrix rotation in container
    metric: rotation_present
    type: bool
    pass: false
    flag: true

  - code: quality-edit-list
    name: Edit list present
    metric: edit_list_present
    type: bool
    pass: false
    flag: true

  - code: quality-multiple-video-tracks
    name: Multiple video tracks
    metric: video_track_count
    type: int
    pass: "1"
    flag: ">1"

  - code: quality-blurry
    name: Video is blurry
    metric: blur_score
    type: float
    pass: ">=10"           # lower than base — fisheye cameras are softer
    flag: "3–10"
    reject: "<3"

  - code: quality-bad-exposure
    name: Exposure out of range
    metric: brightness
    type: float
    pass: "0.2–0.8"
    flag: "0.1–0.9"
    reject: "<0.1"

  - code: quality-lens-blocked
    name: Lens obstruction
    metric: blockage_ratio
    type: ratio
    pass: "<0.05"
    flag: "<0.25"
    reject: ">=0.25"

  - code: quality-duration-out-of-bounds
    name: Duration out of bounds
    metric: duration_sec
    type: float
    pass: "60–600"
    flag: "30–60"
    reject: "<30"

  - code: quality-invalid-intrinsics
    name: Camera intrinsics invalid
    metric: intrinsics_valid
    type: bool
    pass: true
    reject: false
    note: Head-mounted rigs require valid fisheye distortion coefficients (e.g. OpenCV k1-k4)

  # ── Privacy ──

  - code: privacy-bathroom-visible
    name: Bathroom visible
    metric: bathroom_ratio
    type: ratio
    pass: "<0.05"
    reject: ">=0.1"

  - code: privacy-reflective-surface
    name: Reflective surface exposing identifiable content
    metric: reflective_ratio
    type: ratio
    pass: "<0.05"
    flag: "0.05–0.15"
    reject: ">=0.15"

  - code: privacy-phone-visible
    name: Phone visible
    metric: phone_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.3"
    reject: ">=0.3"

  - code: privacy-document-visible
    name: Personal document visible
    metric: document_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.2"
    reject: ">=0.2"

  - code: privacy-face-visible
    name: Identifiable face
    metric: face_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.25"
    reject: ">=0.25"

  - code: privacy-person-closeup
    name: Close-range person detected
    metric: person_closeup_ratio
    type: ratio
    pass: "<0.25"
    flag: "0.25–0.5"

  - code: privacy-visible-text
    name: Visible text detected
    metric: text_frames_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.3"
    reject: ">=0.3"

  - code: privacy-screen-visible
    name: Screen content visible
    metric: screen_ratio
    type: ratio
    pass: "<0.3"
    flag: "0.3–0.5"
    reject: ">=0.5"

  - code: privacy-speech-audio
    name: Speech in audio track
    metric: speech_ratio
    type: ratio
    pass: "<0.05"
    reject: ">=0.05"

  # ── Safety ──

  - code: safety-sharp-object
    name: Unsafe sharp object
    metric: sharp_object_ratio
    type: ratio
    pass: "<0.05"
    flag: "0.05–0.1"
    reject: ">=0.1"

  # ── Training Value ──

  - code: training-no-hands-visible
    name: No hands visible
    metric: person_ratio
    type: ratio
    pass: ">=0.5"
    flag: "0.1–0.5"
    reject: "<0.1"

  - code: training-static-video
    name: Static video
    metric: motion_score
    type: float
    pass: ">=6"
    flag: "3–6"
    reject: "<3"

  - code: training-black-frames
    name: Excessive black frames
    metric: black_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.3"
    reject: ">=0.3"

  - code: training-frozen-video
    name: Frozen / stuck video
    metric: freeze_ratio
    type: ratio
    pass: "<0.2"
    flag: "0.2–0.5"
    reject: ">=0.5"

  # ── Metadata ──

  - code: metadata-mismatch
    name: Metadata mismatch
    metric: metadata_match
    type: bool
    pass: true
    flag: false

  # ── Sensor Quality ──

  - code: quality-missing-imu
    name: IMU data missing
    metric: imu_present
    type: bool
    pass: true
    reject: false
    note: Accelerometer + gyroscope required for ego-motion estimation and head/hand separation

  - code: quality-imu-desync
    name: IMU data out of sync with video
    metric: imu_sync_drift_ms
    type: float
    unit: milliseconds
    pass: "<10"
    flag: "10–50"
    reject: ">=50"
    note: Drift above 50ms makes fused pose estimation unreliable

  - code: quality-missing-depth
    name: Depth channel missing
    metric: depth_present
    type: bool
    pass: true
    flag: false
    note: Useful for 3D reconstruction but not required for all egocentric tasks

  # ── Ego-Exo ──

  - code: egoexo-egomotion-missing
    name: Egomotion data missing
    metric: egomotion_valid
    type: bool
    pass: true
    reject: false
    note: SLAM or high-freq IMU data required to separate head motion from hand motion

  - code: egoexo-sparse-narration
    name: Narration too sparse
    metric: narration_density
    type: float
    unit: annotations_per_min
    pass: ">=2.0"
    flag: "0.5–2.0"
    reject: "<0.5"
    note: Timestamped micro-annotations, not single-label descriptions (Ego4D / Ego-Exo4D standard)

  # ── Task Granularity ──

  - code: task-maneuverability-untagged
    name: Maneuverability class not tagged
    metric: maneuverability_tagged
    type: bool
    pass: true
    flag: false
    note: "Tag as coarse (push, pour) or fine (thread needle, insert USB). Fine tasks require stricter blur thresholds."
