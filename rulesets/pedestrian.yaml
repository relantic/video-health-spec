# Pedestrian profile — ego navigation in pedestrian environments.
# Walking robots, assistive devices, sidewalk navigation, indoor wayfinding.
# Base quality/privacy/safety checks + navigation sensors (IMU, depth, GPS)
# + path/obstacle rules + strict pedestrian privacy.
#
# Codes carry their category as a prefix: quality-*, privacy-*, safety-*,
# metadata-*, nav-*. The validator emits the full path
# `video-health/pedestrian/{code}` when an issue fires.

rules:

  # ── Technical Quality ──

  - code: quality-missing-moov
    name: Missing 'moov' atom
    metric: moov_present
    type: bool
    pass: true
    reject: false

  - code: quality-corrupt-header
    name: Corrupt container header
    metric: header_valid
    type: bool
    pass: true
    reject: false

  - code: quality-truncated-file
    name: Truncated file
    metric: file_complete
    type: bool
    pass: true
    reject: false

  - code: quality-no-keyframes
    name: No keyframes
    metric: keyframes_present
    type: bool
    pass: true
    reject: false

  - code: quality-gop-too-long
    name: GOP too long
    metric: max_gop_sec
    type: float
    pass: "<=10"
    flag: ">10"

  - code: quality-duplicate-frames
    name: Duplicate frames detected
    metric: duplicate_frame_count
    type: int
    pass: 0
    flag: ">0"

  - code: quality-timing-gaps
    name: Timing gaps in sample table
    metric: timing_gaps_present
    type: bool
    pass: false
    flag: true

  - code: quality-low-bitrate
    name: Bitrate too low
    metric: bit_rate
    type: int
    pass: ">=500000"
    flag: "<500000"

  - code: quality-high-bitrate
    name: Bitrate too high
    metric: bit_rate
    type: int
    pass: "<=50000000"
    flag: ">50000000"

  - code: quality-file-too-small
    name: File below minimum size
    metric: size_bytes
    type: int
    pass: ">=1024"
    reject: "<1024"

  - code: quality-ffprobe-failed
    name: ffprobe failed to parse video
    metric: ffprobe_ok
    type: bool
    pass: true
    flag: false

  - code: quality-validator-error
    name: Validator encountered an error processing the file
    metric: validator_ok
    type: bool
    pass: true
    flag: false

  - code: quality-spec-mismatch
    name: Codec or resolution does not match spec
    metric: spec_match
    type: bool
    pass: true
    flag: false

  - code: quality-variable-frame-rate
    name: Variable frame rate
    metric: vfr_detected
    type: bool
    pass: false
    flag: true

  - code: quality-irregular-gop
    name: Irregular GOP structure
    metric: gop_cv
    type: float
    pass: "<0.3"
    flag: ">=0.3"

  - code: quality-container-codec-mismatch
    name: Container and codec do not match
    metric: container_codec_match
    type: bool
    pass: true
    flag: false

  - code: quality-metadata-rotation
    name: Display matrix rotation in container
    metric: rotation_present
    type: bool
    pass: false
    flag: true

  - code: quality-edit-list
    name: Edit list present
    metric: edit_list_present
    type: bool
    pass: false
    flag: true

  - code: quality-multiple-video-tracks
    name: Multiple video tracks
    metric: video_track_count
    type: int
    pass: "1"
    flag: ">1"

  - code: quality-blurry
    name: Video is blurry
    metric: blur_score
    type: float
    pass: ">=10"           # body-mounted cameras bounce during walking
    flag: "3–10"
    reject: "<3"

  - code: quality-bad-exposure
    name: Exposure out of range
    metric: brightness
    type: float
    pass: "0.1–0.9"        # tunnels, building shadows, direct sun
    flag: "0.05–0.95"
    reject: "<0.05"

  - code: quality-lens-blocked
    name: Lens obstruction
    metric: blockage_ratio
    type: ratio
    pass: "<0.05"
    flag: "<0.25"
    reject: ">=0.25"

  - code: quality-duration-out-of-bounds
    name: Duration out of bounds
    metric: duration_sec
    type: float
    pass: "120–1800"       # navigation routes: 2min to 30min
    flag: "60–120"
    reject: "<60"

  - code: quality-invalid-intrinsics
    name: Camera intrinsics invalid
    metric: intrinsics_valid
    type: bool
    pass: true
    reject: false
    note: Navigation requires calibrated intrinsics for obstacle distance estimation

  # ── Sensor Quality ──

  - code: quality-missing-imu
    name: IMU data missing
    metric: imu_present
    type: bool
    pass: true
    reject: false
    note: Required for dead reckoning and obstacle avoidance

  - code: quality-imu-desync
    name: IMU data out of sync with video
    metric: imu_sync_drift_ms
    type: float
    unit: milliseconds
    pass: "<10"
    flag: "10–50"
    reject: ">=50"

  - code: quality-missing-depth
    name: Depth channel missing
    metric: depth_present
    type: bool
    pass: true
    reject: false
    note: Required for obstacle distance estimation and path planning

  # ── Privacy ──

  - code: privacy-bathroom-visible
    name: Bathroom visible
    metric: bathroom_ratio
    type: ratio
    pass: "<0.05"
    reject: ">=0.1"

  - code: privacy-reflective-surface
    name: Reflective surface exposing identifiable content
    metric: reflective_ratio
    type: ratio
    pass: "<0.05"
    flag: "0.05–0.15"
    reject: ">=0.15"

  - code: privacy-phone-visible
    name: Phone visible
    metric: phone_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.3"
    reject: ">=0.3"

  - code: privacy-document-visible
    name: Personal document visible
    metric: document_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.2"
    reject: ">=0.2"

  - code: privacy-face-visible
    name: Identifiable face
    metric: face_ratio
    type: ratio
    pass: "<0.05"          # stricter — pedestrians constantly in frame
    flag: "0.05–0.15"
    reject: ">=0.15"

  - code: privacy-person-closeup
    name: Close-range person detected
    metric: person_closeup_ratio
    type: ratio
    pass: "<0.15"          # stricter — close encounters with pedestrians are common
    flag: "0.15–0.35"
    reject: ">=0.35"

  - code: privacy-visible-text
    name: Visible text detected
    metric: text_frames_ratio
    type: ratio
    pass: "<0.05"          # stricter — storefronts, signs, addresses
    flag: "0.05–0.2"
    reject: ">=0.2"

  - code: privacy-screen-visible
    name: Screen content visible
    metric: screen_ratio
    type: ratio
    pass: "<0.3"
    flag: "0.3–0.5"
    reject: ">=0.5"

  - code: privacy-speech-audio
    name: Speech in audio track
    metric: speech_ratio
    type: ratio
    pass: "<0.05"
    reject: ">=0.05"

  # ── Safety ──

  - code: safety-sharp-object
    name: Unsafe sharp object
    metric: sharp_object_ratio
    type: ratio
    pass: "<0.05"
    flag: "0.05–0.1"
    reject: ">=0.1"

  # ── Training Value ──

  - code: training-black-frames
    name: Excessive black frames
    metric: black_ratio
    type: ratio
    pass: "<0.1"
    flag: "0.1–0.3"
    reject: ">=0.3"

  - code: training-frozen-video
    name: Frozen / stuck video
    metric: freeze_ratio
    type: ratio
    pass: "<0.2"
    flag: "0.2–0.5"
    reject: ">=0.5"

  # ── Metadata ──

  - code: metadata-mismatch
    name: Metadata mismatch
    metric: metadata_match
    type: bool
    pass: true
    flag: false

  # ── Navigation ──

  - code: nav-gps-invalid
    name: GPS data invalid or missing
    metric: gps_valid
    type: bool
    pass: true
    reject: false
    note: Required for route reconstruction and geofencing. Indoor segments may use WiFi/BLE positioning.

  - code: nav-gps-drift
    name: GPS drift excessive
    metric: gps_drift_m
    type: float
    unit: meters
    pass: "<5"
    flag: "5–20"
    reject: ">=20"
    note: Urban canyons commonly cause drift in the 5–20m range

  - code: nav-obstacle-not-annotated
    name: Obstacle annotations missing
    metric: obstacle_annotated
    type: bool
    pass: true
    flag: false
    note: Navigable path segments should include obstacle annotations (curbs, poles, bollards, pedestrians, vehicles)

  - code: nav-path-discontinuity
    name: Navigation path discontinuity
    metric: path_gap_count
    type: int
    pass: "0"
    flag: "1–3"
    reject: ">3"
    note: Gaps where position tracking was lost. More than 3 makes the route unusable for path planning.

  - code: nav-surface-untagged
    name: Surface type not tagged
    metric: surface_tagged
    type: bool
    pass: true
    flag: false
    note: "Tag traversal surface: sidewalk, crosswalk, ramp, stairs, elevator, grass, gravel, indoor_tile, indoor_carpet"
